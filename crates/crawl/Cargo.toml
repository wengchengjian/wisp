aho-corasick = "1"
moka = { workspace = true }
dashmap = { workspace = true }
parking_lot = { workspace = true }
chrono = { workspace = true }
htmd = "0.5"
url = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
insta = { workspace = true }
