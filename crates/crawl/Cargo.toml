[package]
name = "wisp-crawl"
version = "0.1.0"
edition = "2021"

[features]
default = []
browser = ["wisp-fetcher/browser"]
stealth = ["browser", "wisp-fetcher/stealth"]

[dependencies]
wisp-core = { path = "../core" }
wisp-fetcher = { path = "../fetcher" }
wisp-http = { path = "../http" }
wisp-parser = { path = "../parser" }
wisp-storage = { path = "../storage" }
wisp-proxy = { path = "../proxy" }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
futures = "0.3"
tracing = "0.1"
bincode = "1.3.3"
regex = "1"
aho-corasick = "1"
moka = { version = "0.12", features = ["future", "sync"] }
dashmap = "6"
parking_lot = "0.12"
chrono = { version = "0.4", features = ["serde"] }
htmd = "0.5"
url = "2"
