[package]
name = "wisp-http"
version = "0.1.0"
edition = "2024"
rust-version = "1.91.1"
license = "Apache-2.0"

[dependencies]
wisp-core = { workspace = true }
serde_json = { workspace = true }
url = { workspace = true }
futures = { workspace = true }
tracing = { workspace = true }
rand = { workspace = true }
hickory-resolver = { version = "0.26", default-features = false, features = ["tokio", "https-ring", "webpki-roots"] }
wreq = { workspace = true, features = ["socks"] }
wreq-util = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
