[package]
name = "wisp-fetcher"
version = "0.1.0"
edition = "2024"

[features]
default = []
browser = ["dep:wisp-browser"]
stealth = ["browser", "dep:wisp-stealth"]

[dependencies]
wisp-core = { path = "../core" }
wisp-http = { path = "../http" }
wisp-browser = { path = "../browser", optional = true }
wisp-stealth = { path = "../stealth", optional = true }
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
tracing = "0.1"
moka = { version = "0.12", features = ["future", "sync"] }
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
wreq-util = "=3.0.0-rc.14"
wreq = { version = "=6.0.0-rc.29", features = ["cookies", "stream"] }

[dev-dependencies]
wisp-parser = { path = "../parser" }
tempfile = "3"
