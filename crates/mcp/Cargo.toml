[package]
name = "wisp-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.91.1"
license = "Apache-2.0"

[features]
default = ["browser"]
browser = ["wisp-fetcher/browser"]
stealth = ["wisp-fetcher/stealth"]
sqlite = ["wisp-storage/sqlite"]

[dependencies]
wisp-core = { workspace = true }
