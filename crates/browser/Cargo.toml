[package]
name = "wisp-browser"
version = "0.1.0"
edition = "2024"

[dependencies]
wisp-core = { path = "../core" }
tokio = { version = "1", features = ["full"] }
serde_json = "1"
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
tungstenite = "0.30"
which = "7"
zip = "2"
tempfile = "3"
base64 = "0.22"
rand = "0.10"
futures = "0.3"
wreq = { version = "=6.0.0-rc.29", features = ["cookies", "stream"] }
regex = "1"
url = "2"
tracing = "0.1"
