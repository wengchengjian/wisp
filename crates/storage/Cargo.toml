[package]
name = "wisp-storage"
version = "0.1.0"
edition = "2021"

[features]
default = []
sqlite = ["dep:rusqlite"]

[dependencies]
wisp-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3.3"
chrono = { version = "0.4", features = ["serde"] }
moka = { version = "0.12", features = ["future", "sync"] }
parking_lot = "0.12"
rusqlite = { version = "0.39", features = ["bundled"], optional = true }

[dev-dependencies]
tempfile = "3"
