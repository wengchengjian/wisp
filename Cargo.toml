[workspace]
members = ["crates/core", "crates/storage", "crates/parser", "crates/proxy", "crates/http", "crates/browser", "crates/stealth", "crates/fetcher", "crates/crawl", "crates/mcp"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91.1"
license = "Apache-2.0"
description = "Lightweight undetected browser automation for Rust - built for scraping"

[workspace.dependencies]
wisp-core = { path = "crates/core", version = "0.1.0" }
wisp-storage = { path = "crates/storage", version = "0.1.0" }
wisp-parser = { path = "crates/parser", version = "0.1.0" }
wisp-proxy = { path = "crates/proxy", version = "0.1.0" }
wisp-http = { path = "crates/http", version = "0.1.0" }
wisp-browser = { path = "crates/browser", version = "0.1.0" }
wisp-stealth = { path = "crates/stealth", version = "0.1.0" }
wisp-fetcher = { path = "crates/fetcher", version = "0.1.0" }
wisp-crawl = { path = "crates/crawl", version = "0.1.0" }
wisp-mcp = { path = "crates/mcp", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
url = "2"
regex = "1"
tracing = "0.1"
rand = "0.10"
futures = "0.3"
async-trait = "0.1"
bincode = "1.3.3"
moka = { version = "0.12", features = ["future", "sync"] }
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
tempfile = "3"
dashmap = "6"
wreq = { version = "=6.0.0-rc.29", features = ["cookies", "stream"] }
wreq-util = "=3.0.0-rc.14"
aho-corasick = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
criterion = { version = "0.5", features = ["html_reports"] }
encoding_rs = "0.8"
hickory-resolver = { version = "0.26", default-features = false, features = ["tokio", "https-ring", "webpki-roots"] }
htmd = "0.5"
rusqlite = { version = "0.39", features = ["bundled"] }
thiserror = "2"
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tungstenite = "0.30"
which = "7"
woven-html = "0.1"
zip = "2"
console-subscriber = "0.5"
loom = "0.7"
proptest = "1"
insta = "1"

[package]
name = "wisp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
license.workspace = true

[features]
default = ["http", "browser", "stealth", "mcp"]
# HTTP 模式（默认启用）：HTTP fetcher + parser + storage + crawl 基础
http = []
# 浏览器模式（Dynamic）：启用 browser 模块 + DynamicStrategy
browser = ["wisp-fetcher/browser", "wisp-crawl/browser", "dep:wisp-browser"]
# Stealth 模式：启用 stealth 模块 + StealthStrategy（依赖 browser）
stealth = ["browser", "wisp-fetcher/stealth", "wisp-crawl/stealth", "dep:wisp-stealth", "wisp-mcp?/stealth"]
# MCP 服务：启用 mcp 模块
mcp = ["dep:wisp-mcp"]
# 启用 SQLite 存储后端（默认禁用，使用 FileStore）
sqlite = ["wisp-storage/sqlite", "wisp-mcp?/sqlite"]
# 开发期 Tokio Console 观测（需 RUSTFLAGS="--cfg tokio_unstable"）
console = ["dep:console-subscriber", "tokio/tracing"]

[dependencies]
wisp-core = { workspace = true }
wisp-storage = { workspace = true }
wisp-parser = { workspace = true }
wisp-proxy = { workspace = true }
wisp-http = { workspace = true }
wisp-browser = { workspace = true, optional = true }
wisp-stealth = { workspace = true, optional = true }
wisp-fetcher = { workspace = true }
wisp-crawl = { workspace = true }
wisp-mcp = { workspace = true, optional = true }
tokio = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
tracing-subscriber = { workspace = true }
console-subscriber = { workspace = true, optional = true }
wreq-util = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
criterion = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
bincode = { workspace = true }
moka = { workspace = true }
tokio-stream = { workspace = true }
parking_lot = { workspace = true }
tempfile = { workspace = true }
regex = { workspace = true }
rand = { workspace = true }
chrono = { workspace = true }
dashmap = { workspace = true }
serde = { workspace = true }
tracing = { workspace = true }
wreq = { workspace = true }

[[bench]]
name = "bench"
harness = false

[[example]]
name = "basic"
required-features = ["browser"]

[[bin]]
name = "wisp"
path = "src/bin/wisp/main.rs"
# bin/wisp.rs 包含 Browser/Mcp 命令，需要对应 feature 才能编译；
# HTTP-only 构建用 `cargo build --lib --no-default-features --features http`。
required-features = ["browser", "stealth", "mcp"]

# ND-001-DEP：release profile 优化（性能敏感的爬虫框架）
# 注意：未启用 panic = "abort"，因为部分 Drop 实现依赖 catch_unwind 语义
# （如 Page::Drop 的 tokio::spawn 兜底）。如需进一步缩减二进制体积可手动启用。
[profile.release]
lto = "thin"      # 跨 crate 内联优化，约 5-10% 性能提升
codegen-units = 1 # 单 codegen unit，最佳优化（牺牲编译时间）
strip = true      # 移除调试符号，减小二进制体积
opt-level = 3     # 默认值，显式声明

# profiling 专用：保留 debug 符号，供 ETW/samply/flamegraph 做函数级分析。
[profile.profiling]
inherits = "release"
debug = 2
strip = false
