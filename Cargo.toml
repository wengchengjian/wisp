[package]
name = "wisp"
version = "0.1.0"
edition = "2021"
description = "Lightweight undetected browser automation for Rust - built for scraping"
license = "Apache-2.0"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3"
which = "7"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
tungstenite = "0.30"
anyhow = "1"
rand = "0.10"
# Scraping / parsing（启用 atomic feature 使 Html: Send，支持 tokio::spawn）
scraper = { version = "0.27", features = ["atomic"] }
ego-tree = "0.11"
encoding_rs = "0.8"
url = "2"
async-trait = "0.1"
wreq = { version = "=6.0.0-rc.29", features = ["cookies", "stream"] }
wreq-util = "=3.0.0-rc.14"
toml = "1"
regex = "1"
aho-corasick = "1"
# SQLite 统一存储（阶段 1：adaptive + checkpoint）
rusqlite = { version = "0.40", features = ["bundled"] }
# checkpoint blob 序列化（3.0.0 有编译问题，暂用 1.x 稳定版）
bincode = "1"
# 流式输出（阶段 1 内部用，阶段 3 对外暴露）
tokio-stream = "0.1"
# 时间戳（CrawlState 用）
chrono = { version = "0.4", features = ["serde"] }
# 内存级请求缓存
moka = { version = "0.12", features = ["future", "sync"] }
# HTML -> Markdown 转换
htmd = "0.5"
# Cron 表达式解析
croner = "3"
# 高并发无锁 map（替代 domain_sems 的全局 Mutex<HashMap>）
dashmap = "6"
# 无 poison 的 Mutex（替代 std::sync::Mutex，避免 panic 传染）
parking_lot = "0.12"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "bench"
harness = false

[[bin]]
name = "wisp"
path = "src/bin/wisp.rs"
