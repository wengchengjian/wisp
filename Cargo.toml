[workspace]
members = ["crates/core", "crates/storage", "crates/parser", "crates/proxy", "crates/http", "crates/browser", "crates/stealth", "crates/fetcher", "crates/crawl", "crates/mcp"]
resolver = "2"

[package]
name = "wisp"
version = "0.1.0"
edition = "2021"
description = "Lightweight undetected browser automation for Rust - built for scraping"
license = "Apache-2.0"

[features]
default = ["http", "browser", "stealth", "mcp"]
# HTTP 模式（默认启用）：HTTP fetcher + parser + storage + crawl 基础
http = []
# 浏览器模式（Dynamic）：启用 browser 模块 + DynamicStrategy
browser = ["wisp-fetcher/browser"]
# Stealth 模式：启用 stealth 模块 + StealthStrategy（依赖 browser）
stealth = ["wisp-fetcher/stealth"]
# MCP 服务：启用 mcp 模块
mcp = []
# 启用 SQLite 存储后端（默认禁用，使用 FileStore）
sqlite = ["wisp-storage/sqlite"]

[dependencies]
wisp-core = { path = "crates/core" }
wisp-storage = { path = "crates/storage" }
wisp-parser = { path = "crates/parser" }
wisp-proxy = { path = "crates/proxy" }
wisp-http = { path = "crates/http" }
wisp-browser = { path = "crates/browser" }
wisp-stealth = { path = "crates/stealth" }
wisp-fetcher = { path = "crates/fetcher" }
wisp-crawl = { path = "crates/crawl" }
wisp-mcp = { path = "crates/mcp" }
tokio = { version = "1", features = ["full"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wreq-util = "=3.0.0-rc.14"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
criterion = { version = "0.5", features = ["html_reports"] }
async-trait = "0.1"
futures = "0.3"
bincode = "1.3.3"
moka = { version = "0.12", features = ["future", "sync"] }
tokio-stream = "0.1"
parking_lot = "0.12"
tempfile = "3"
regex = "1"
rand = "0.10"
chrono = { version = "0.4", features = ["serde"] }
dashmap = "6"
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
wreq = { version = "=6.0.0-rc.29", features = ["cookies", "stream"] }

[[bench]]
name = "bench"
harness = false

[[bin]]
name = "wisp"
path = "src/bin/wisp.rs"

# ND-001-DEP：release profile 优化（性能敏感的爬虫框架）
# 注意：未启用 panic = "abort"，因为部分 Drop 实现依赖 catch_unwind 语义
# （如 Page::Drop 的 tokio::spawn 兜底）。如需进一步缩减二进制体积可手动启用。
[profile.release]
lto = "thin"      # 跨 crate 内联优化，约 5-10% 性能提升
codegen-units = 1 # 单 codegen unit，最佳优化（牺牲编译时间）
strip = true      # 移除调试符号，减小二进制体积
opt-level = 3     # 默认值，显式声明

# profiling 专用：保留 debug 符号，供 ETW/samply/flamegraph 做函数级分析。
[profile.profiling]
inherits = "release"
debug = 2
strip = false
