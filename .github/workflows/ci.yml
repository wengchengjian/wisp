name: CI

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    env:
      CARGO_TERM_COLOR: always
      INSTA_UPDATE: no
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-llvm-cov,cargo-deny

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run doctests
        run: cargo test --doc --workspace --all-features --locked

      - name: Run nextest
        run: cargo nextest run --workspace --all-features --locked --status-level pass --no-fail-fast

      - name: Check dependencies
        run: cargo deny check advisories licenses bans sources

      - name: Generate coverage report
        run: cargo llvm-cov nextest --workspace --all-features --locked --no-fail-fast --html --output-dir target/coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: target/coverage
          if-no-files-found: error
